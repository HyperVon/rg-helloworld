name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (CLI + vector normalizer)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [cmd/rghello, services/vector-normalizer-go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
        working-directory: ${{ matrix.module }}
      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}
      - name: Test with coverage
        run: RGHELLO_CHILD_COVER="$PWD/coverage.child.out" go test -coverprofile=coverage.out ./...
        working-directory: ${{ matrix.module }}
      - name: Coverage gate (90%)
        run: head -1 coverage.out > coverage.merged.out && grep -h -v '^mode:' coverage.out coverage.child.out | awk '{key=$1; if (!(key in cnt)) {span[key]=$1; stmt[key]=$2} cnt[key]+=$3} END {for (k in span) print span[k], stmt[k], cnt[k]}' | sort >> coverage.merged.out && go tool cover -func=coverage.merged.out | awk '/^total:/ { print $3; if ($3+0 < 90) exit 1 }'
        working-directory: ${{ matrix.module }}
      - name: Build
        run: go build ./...
        working-directory: ${{ matrix.module }}

  java:
    name: Java (glyph catalog)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (spotless + tests + JaCoCo 90%)
        run: mvn -B -ntp verify
        working-directory: services/glyph-catalog-java

  kotlin:
    name: Kotlin (run orchestrator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Grant wrapper execute permission
        run: chmod +x gradlew
        working-directory: services/run-orchestrator-kotlin
      - name: Build with coverage (ktlint + tests + JaCoCo 90%)
        run: ./gradlew --console=plain build
        working-directory: services/run-orchestrator-kotlin

  cpp:
    name: C++ (geometry engine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-18 gcovr
      - name: Format check
        run: clang-format-18 --dry-run --Werror src/*.cpp include/geometry_engine/*.hpp tests/*.cpp
        working-directory: services/geometry-engine-cpp
      - name: Configure and build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DCMAKE_CXX_COMPILER=g++
        working-directory: services/geometry-engine-cpp
      - name: Build
        run: cmake --build build
        working-directory: services/geometry-engine-cpp
      - name: Test
        run: ctest --test-dir build --output-on-failure
        working-directory: services/geometry-engine-cpp
      - name: Coverage gate (90% lines)
        run: gcovr --root . --object-directory build --filter 'src/.*' --filter 'include/.*' --fail-under-line 90
        working-directory: services/geometry-engine-cpp

  dotnet:
    name: C# (rasterizer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
      - name: Format check
        run: dotnet format --verify-no-changes --nologo
        working-directory: services/rasterizer-dotnet
      - name: Build
        run: dotnet build --nologo
        working-directory: services/rasterizer-dotnet
      - name: Test with coverage gate (90%)
        run: dotnet test --nologo /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Threshold=90 /p:CoverletOutput=coverage/
        working-directory: services/rasterizer-dotnet

  python:
    name: Python (image pipeline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
          cache: pip
          cache-dependency-path: services/image-pipeline-python/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: services/image-pipeline-python
      - name: Lint
        run: ruff check .
        working-directory: services/image-pipeline-python
      - name: Format check
        run: ruff format --check .
        working-directory: services/image-pipeline-python
      - name: Test
        run: PYTHONPATH=src python3 -m unittest discover -s tests
        working-directory: services/image-pipeline-python
      - name: Coverage gate (90%)
        run: PYTHONPATH=src coverage run -m unittest discover -s tests && coverage report --fail-under=90
        working-directory: services/image-pipeline-python

  node:
    name: Node.js/TypeScript (OCR worker + event gateway)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [ocr-worker-node, event-gateway-node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.6.0
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: services/${{ matrix.service }}
      - name: Lint (prettier + typecheck)
        run: npm run lint
        working-directory: services/${{ matrix.service }}
      - name: Test
        run: npm test
        working-directory: services/${{ matrix.service }}
      - name: Coverage gate (90%)
        run: npm run coverage
        working-directory: services/${{ matrix.service }}

  ruby:
    name: Ruby (adjudicator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 4.0.6
          bundler-cache: true
          working-directory: services/adjudicator-ruby
      - name: Lint (rubocop)
        run: bundle exec rubocop
        working-directory: services/adjudicator-ruby
      - name: Test
        run: bundle exec rake test
        working-directory: services/adjudicator-ruby
      - name: Coverage gate (90%)
        run: bundle exec rake coverage
        working-directory: services/adjudicator-ruby

  rust:
    name: Rust (phrase assembler)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      - name: Format check
        run: cargo fmt --check
        working-directory: services/phrase-assembler-rust
      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: services/phrase-assembler-rust
      - name: Test
        run: cargo test
        working-directory: services/phrase-assembler-rust
      - name: Build
        run: cargo build
        working-directory: services/phrase-assembler-rust
      - name: Coverage gate (90% lines)
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-llvm-cov
      - name: Coverage gate (90% lines)
        run: cargo llvm-cov --fail-under-lines 90
        working-directory: services/phrase-assembler-rust

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck scripts/*.sh tests/integration/run_integration.sh tests/end-to-end/run_e2e.sh

  docs:
    name: Documentation (markdownlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.6.0
      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  integration-e2e:
    name: Integration + E2E (full toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.6.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 4.0.6
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      - name: Install C++ tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Prepare dependencies
        run: make prerequisites
      - name: Integration tests
        run: make integration
      - name: E2E acceptance (gates run by matrix jobs)
        run: E2E_SKIP_GATES=1 make e2e

  summary:
    name: CI summary
    runs-on: ubuntu-24.04
    needs: [go, java, kotlin, cpp, dotnet, python, node, ruby, rust, shell, docs, integration-e2e]
    steps:
      - name: All jobs passed
        run: echo "All CI jobs passed"
