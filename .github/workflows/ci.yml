name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (CLI + vector normalizer)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [cmd/rghw, services/vector-normalizer-go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
        working-directory: ${{ matrix.module }}
      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}
      - name: Test with coverage
        # Generated proto code (internal/rasterproto) is excluded from the
        # coverage profile, mirroring the C++ gcovr excludes.
        run: RGHELLO_CHILD_COVER="$PWD/coverage.child.out" go test -coverprofile=coverage.out $(go list ./... | grep -v '/internal/rasterproto$')
        working-directory: ${{ matrix.module }}
      - name: Coverage gate (90%)
        run: head -1 coverage.out > coverage.merged.out && grep -h -v '^mode:' coverage.out coverage.child.out | awk '{key=$1; if (!(key in cnt)) {span[key]=$1; stmt[key]=$2} cnt[key]+=$3} END {for (k in span) print span[k], stmt[k], cnt[k]}' | sort >> coverage.merged.out && go tool cover -func=coverage.merged.out | awk '/^total:/ { print $3; if ($3+0 < 90) exit 1 }'
        working-directory: ${{ matrix.module }}
      - name: Build
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: Generated proto code is up to date
        run: bash scripts/gen-proto.sh --check

  java:
    name: Java (glyph catalog)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify (spotless + tests + JaCoCo 90%)
        run: mvn -B -ntp verify
        working-directory: services/glyph-catalog-java

  kotlin:
    name: Kotlin (run orchestrator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Grant wrapper execute permission
        run: chmod +x gradlew
        working-directory: services/run-orchestrator-kotlin
      - name: Build with coverage (ktlint + tests + JaCoCo 90%)
        run: ./gradlew --console=plain build
        working-directory: services/run-orchestrator-kotlin

  cpp:
    name: C++ (geometry engine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-${{ env.CLANG_FORMAT_VERSION }} gcovr librdkafka-dev=${{ env.LIBRDKAFKA_UBUNTU_VERSION }}
      - name: Format check
        run: clang-format-${{ env.CLANG_FORMAT_VERSION }} --dry-run --Werror src/*.cpp include/geometry_engine/*.hpp tests/*.cpp
        working-directory: services/geometry-engine-cpp
      - name: Configure and build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DCMAKE_CXX_COMPILER=g++
        working-directory: services/geometry-engine-cpp
      - name: Build
        run: cmake --build build
        working-directory: services/geometry-engine-cpp
      - name: Test
        run: ctest --test-dir build --output-on-failure
        working-directory: services/geometry-engine-cpp
      - name: Coverage gate (90% lines)
        # Excludes mirror the Makefile `coverage-cpp` target exactly.
        run: gcovr --root . --object-directory build --filter 'src/.*' --filter 'include/.*' --exclude 'src/kafka.cpp' --fail-under-line 90
        working-directory: services/geometry-engine-cpp

  dotnet:
    name: C# (rasterizer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - name: Format check
        # --nologo is parsed as a workspace path by dotnet format on SDK
        # 10.0.302, so it must be omitted here.
        run: |
          dotnet format --verify-no-changes
          dotnet format --verify-no-changes cli/rasterizer.Cli.csproj
          dotnet format --verify-no-changes rasterizer.Tests/rasterizer.Tests.csproj
        working-directory: services/rasterizer-dotnet
      - name: Build
        run: |
          dotnet build --nologo cli/rasterizer.Cli.csproj
          dotnet build --nologo rasterizer.Tests/rasterizer.Tests.csproj
        working-directory: services/rasterizer-dotnet
      - name: Test with coverage gate (90%)
        run: dotnet test --nologo rasterizer.Tests/rasterizer.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Threshold=90 /p:CoverletOutput=coverage/
        working-directory: services/rasterizer-dotnet
      - name: Generated C# gRPC code is up to date
        run: bash scripts/gen-csharp-proto.sh --check

  python:
    name: Python (image pipeline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/image-pipeline-python/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: services/image-pipeline-python
      - name: Lint
        run: ruff check .
        working-directory: services/image-pipeline-python
      - name: Format check
        run: ruff format --check .
        working-directory: services/image-pipeline-python
      - name: Test
        run: PYTHONPATH=src python3 -m unittest discover -s tests
        working-directory: services/image-pipeline-python
      - name: Coverage gate (90%)
        run: PYTHONPATH=src coverage run -m unittest discover -s tests && coverage report --fail-under=90
        working-directory: services/image-pipeline-python

  node:
    name: Node.js/TypeScript (services)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [ocr-worker-node, event-gateway-node, telemetry-element, web-shell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: services/${{ matrix.service }}
      - name: Install OCR test dependencies
        if: matrix.service == 'ocr-worker-node'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr python3-pil && pip install pillow --quiet
      - name: Lint (prettier + typecheck)
        run: npm run lint
        working-directory: services/${{ matrix.service }}
      - name: Test
        run: npm test
        working-directory: services/${{ matrix.service }}
      - name: Coverage gate (90%, c8)
        if: matrix.service != 'web-shell'
        run: npm run coverage
        working-directory: services/${{ matrix.service }}
      - name: Coverage gate (web-shell, c8 90% lines/functions)
        if: matrix.service == 'web-shell'
        run: npx --yes c8 --lines 90 --functions 90 --reporter=text node --test tests/*.test.ts
        working-directory: services/${{ matrix.service }}

  ruby:
    name: Ruby (adjudicator + inspector)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [adjudicator-ruby, artifact-inspector-ruby]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: services/${{ matrix.service }}
      - name: Lint (rubocop)
        run: bundle exec rubocop --force-exclusion
        working-directory: services/${{ matrix.service }}
      - name: Test
        run: bundle exec rake test
        working-directory: services/${{ matrix.service }}
      - name: Coverage gate (90%)
        run: bundle exec rake coverage
        working-directory: services/${{ matrix.service }}

  rust:
    name: Rust (phrase assembler)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      # Work around a GitHub ubuntu-24.04 runner flake (pre-installed
      # clippy-preview/rustfmt-preview conflict with cargo-clippy).
      - name: Remove conflicting rust preview components
        run: rustup component remove clippy-preview rustfmt-preview 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --check
        working-directory: services/phrase-assembler-rust
      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: services/phrase-assembler-rust
      - name: Test
        run: cargo test
        working-directory: services/phrase-assembler-rust
      - name: Build
        run: cargo build
        working-directory: services/phrase-assembler-rust
      - name: Coverage gate (90% lines)
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-llvm-cov
      - name: Coverage gate (90% lines)
        run: cargo llvm-cov --ignore-filename-regex main.rs --fail-under-lines 90
        working-directory: services/phrase-assembler-rust

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck scripts/*.sh tests/integration/run_integration.sh tests/end-to-end/run_e2e.sh

  docs:
    name: Documentation (markdownlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  contracts:
    name: Contracts + prohibited-field validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/image-pipeline-python/requirements-dev.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: services/image-pipeline-python
      - name: Contracts validate
        run: make contracts
      - name: Prohibited-field static scan
        run: make contract-test

  language-integration:
    name: Language integration (no platform)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      # Work around a GitHub ubuntu-24.04 runner flake: the image ships a
      # pre-installed `clippy-preview`/`rustfmt-preview` rustup component that
      # conflicts with the `cargo-clippy` binary when rustup tries to add clippy.
      # Removing the preview components first lets the toolchain install cleanly.
      - name: Remove conflicting rust preview components
        run: rustup component remove clippy-preview rustfmt-preview 2>/dev/null || true
      - name: Install C++ tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ librdkafka-dev=${{ env.LIBRDKAFKA_UBUNTU_VERSION }}
      - name: Prepare dependencies
        run: make prerequisites
      - name: Integration tests (language cross-build, no cluster)
        run: make integration

  platform-e2e:
    name: Platform E2E (k3d + terraform real cluster path)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load toolchain pins from versions.env
        run: |
          set -a
          . versions.env
          set +a
          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            case "$k" in \#*) continue;; esac
            case "$k" in [A-Za-z_]*) ;; *) continue;; esac
            v="${v%%[[:space:]]#*}"
            v="${v%%#*}"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < versions.env
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Remove conflicting rust preview components
        run: rustup component remove clippy-preview rustfmt-preview 2>/dev/null || true
      - name: Install C++ tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ librdkafka-dev=${{ env.LIBRDKAFKA_UBUNTU_VERSION }}
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG="v${{ env.K3D_VERSION }}" bash
      - name: Install terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      - name: Install platform test clients (mc, psql, redis-cli)
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools
      - name: Install python test dependencies
        run: pip install --break-system-packages -r services/image-pipeline-python/requirements.txt
      - name: Install OCR test dependencies
        # Mirror the Node services job: ocr-worker unit tests spawn
        # `python3` (PIL) and `tesseract` to build fixture images.
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr python3-pil && pip install pillow --break-system-packages --quiet
      - name: Verify platform tooling is installed
        # Hard-fail when platform tools are missing so the cluster path can
        # never silently degrade to a skipped PASS (E2E_REQUIRE_PLATFORM=1).
        run: command -v k3d && command -v terraform && command -v kubectl || { echo "platform tools missing"; exit 1; }
      - name: Prepare dependencies
        run: make prerequisites
      - name: E2E acceptance (real cluster path; platform required)
        run: E2E_SKIP_GATES=1 E2E_REQUIRE_PLATFORM=1 make e2e

  summary:
    name: CI summary
    runs-on: ubuntu-24.04
    needs: [go, java, kotlin, cpp, dotnet, python, node, ruby, rust, shell, docs, contracts, language-integration, platform-e2e]
    steps:
      - name: All jobs passed
        run: echo "All CI jobs passed"
