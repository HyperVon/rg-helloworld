AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  SuggestExtensions: false

Metrics/MethodLength:
  Max: 80

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 300

Metrics/CyclomaticComplexity:
  Max: 8

Naming/MethodParameterName:
  MinNameLength: 2
  AllowNamesEndingInNumbers: true
  AllowedNames: ['ct', 'a', 'id']

Layout/LineLength:
  Max: 200
  Exclude:
    - 'lib/artifact_inspector.rb'

Style/Documentation:
  Enabled: false

Style/DocumentationMethod:
  Enabled: false
