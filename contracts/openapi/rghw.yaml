openapi: 3.0.3
info:
  title: Rube Goldberg Hello World REST API
  version: 1.0.0
  description: |
    REST API for the rghw CLI to interact with the local platform.
    The CLI is the only component that may see the requested plaintext message.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/runs:
    post:
      summary: Create run
      operationId: createRun
      description: |
        Submits a message for processing. Returns 202 Accepted with a run ID.
        The CLI is the only caller that may pass the plaintext message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
            examples:
              hello-world:
                $ref: '#/components/examples/Hello World Request'
      headers:
        Idempotency-Key:
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Run accepted and queued for processing
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
              examples:
                pending:
                  $ref: '#/components/examples/Pending Run'
        '409':
          description: A run with this idempotency key is already in progress
  /api/v1/runs/{runId}:
    get:
      summary: Get run status
      operationId: getRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current run state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRunResponse'
        '404':
          description: Run not found
  /api/v1/runs/{runId}/stream:
    get:
      summary: Stream run events
      operationId: streamRunEvents
      description: |
        Server-Sent Events stream of run lifecycle events.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: Resume from this event ID
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE event stream
  /api/v1/runs/{runId}/artifacts:
    get:
      summary: List artifacts
      operationId: listArtifacts
      description: |
        Return metadata and safe proxy URLs for run artifacts.
        Does not return MinIO credentials or internal cluster hostnames.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Artifact metadata list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
  /api/v1/runs/{runId}/cancel:
    post:
      summary: Cancel run
      operationId: cancelRun
      description: |
        Cooperative cancellation. Already executing workers may finish.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRunResponse'
components:
  schemas:
    CreateRunRequest:
      type: object
      required:
        - message
      additionalProperties: false
      properties:
        message:
          type: string
          description: The requested plaintext message. Only the CLI may provide this.
        options:
          type: object
          additionalProperties: false
          properties:
            retainArtifacts:
              type: boolean
              default: false
            maximumQualityAttempts:
              type: integer
              minimum: 1
              default: 3
            renderProfile:
              type: string
              enum: [DEFAULT, HIGH_QUALITY, LOW_MEMORY]
              default: DEFAULT
    CreateRunResponse:
      type: object
      required:
        - runId
        - status
        - createdAt
        - links
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PLANNING, GEOMETRY, RASTER, COMPOSE, OCR, ADJUDICATION, ASSEMBLY, VALIDATION, SUCCEEDED, FAILED]
        createdAt:
          type: string
          format: date-time
        links:
          type: object
          required:
            - self
            - events
            - stream
            - artifacts
          additionalProperties: false
          properties:
            self:
              type: string
              format: uri
            events:
              type: string
              format: uri
            stream:
              type: string
              format: uri
            artifacts:
              type: string
              format: uri
    GetRunResponse:
      type: object
      required:
        - runId
        - status
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PLANNING, GEOMETRY, RASTER, COMPOSE, OCR, ADJUDICATION, ASSEMBLY, VALIDATION, SUCCEEDED, FAILED]
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        currentStage:
          type: string
        progress:
          type: object
          additionalProperties: false
          properties:
            completedUnits:
              type: integer
            totalUnits:
              type: integer
            percentage:
              type: integer
        attempt:
          type: integer
        output:
          oneOf:
            - type: string
            - type: 'null'
          description: Only present when status is SUCCEEDED
    ArtifactListResponse:
      type: object
      required:
        - artifacts
      additionalProperties: false
      properties:
        artifacts:
          type: array
          items:
            type: object
            required:
              - artifactId
              - contentType
              - objectKey
            additionalProperties: false
            properties:
              artifactId:
                type: string
                format: uuid
              contentType:
                type: string
              objectKey:
                type: string
    CancelRunResponse:
      type: object
      required:
        - runId
        - status
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum: [CANCEL_REQUESTED, RUNNING, NOT_FOUND]
  examples:
    Hello World Request:
      value:
        message: Hello World
        options:
          retainArtifacts: false
          maximumQualityAttempts: 3
          renderProfile: DEFAULT
    Pending Run:
      value:
        runId: 01J8EXAMPLE000000000000001
        status: PLANNING
        createdAt: '2026-08-04T10:45:00Z'
        links:
          self: /api/v1/runs/01J8EXAMPLE000000000000001
          events: /api/v1/runs/01J8EXAMPLE000000000000001/events
          stream: /api/v1/runs/01J8EXAMPLE000000000000001/stream
          artifacts: /api/v1/runs/01J8EXAMPLE000000000000001/artifacts
