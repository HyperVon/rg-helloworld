apiVersion: batch/v1
kind: CronJob
metadata:
  name: artifact-cleanup
  namespace: rube-goldberg
  labels:
    app: artifact-cleanup
    milestone: '12'
spec:
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: cleanup
            image: alpine:3.21
            command:
            - /bin/sh
            - -c
            - "apk add --no-cache mc\nmc alias set myminio \"${MINIO_ENDPOINT}\" \"${MINIO_ACCESS_KEY}\" \"${MINIO_SECRET_KEY}\"\nmc ls myminio/rube-goldberg-artifacts || true\nfind_old_objects() {\n  mc find myminio/rube-goldberg-artifacts \\\n    --name \"*.json\" \\\n    --older-than 168h \\\n    --exec \"mc rm {}\" 2>/dev/null || true\n}\nfind_old_objects\n"
            env:
            - name: MINIO_ENDPOINT
              value: http://minio.rube-goldberg.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                memory: 192Mi
                cpu: 250m
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            imagePullPolicy: IfNotPresent
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          serviceAccountName: artifact-cleanup
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: tmp
            emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifact-cleanup
  namespace: rube-goldberg
  labels:
    app: artifact-cleanup
    milestone: '12'
