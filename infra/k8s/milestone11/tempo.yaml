apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: rube-goldberg
  labels:
    app: tempo
    milestone: "11"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.4.0
          args:
            - '-config.file=/etc/tempo.yaml'
            - '-enable-search'
            - '-target=all'
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
            - name: data
              mountPath: /tmp/tempo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: rube-goldberg
  labels:
    app: tempo
    milestone: "11"
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: rube-goldberg
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 4317
    telemetry:
      metrics:
        disable: true
      traces:
        sampling:
          percent: 100
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
            http:
    searcher:
      backend: local
      local:
        backlog_size: 50000
        max_block_size: 100
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/traces
        pool:
          max_jobs: 100
          max_retries: 10
