apiVersion: v1
kind: Namespace
metadata:
  name: rube-goldberg
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: rube-goldberg
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
      attributes:
        actions:
          - key: service.name
            value: unknown_service
            action: insert
      resourcedetection:
        detectors: [env, system]
        system:
          hostname_sources: [os]

    exporters:
      debug:
        verbosity: basic
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
        tls:
          insecure: true

    service:
      telemetry:
        logs:
          level: "info"
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo, debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [loki]
