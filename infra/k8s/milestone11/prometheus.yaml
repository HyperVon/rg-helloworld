apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: rube-goldberg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cluster-role
rules:
  - apiGroups: ['']
    resources: ['pods', 'nodes', 'services', 'nodes/proxy', 'nodes/metrics']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-cluster-role
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: rube-goldberg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: rube-goldberg
  labels:
    app: prometheus
    milestone: "11"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/etc/prometheus/consoles'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--web.enable-lifecycle'
            - '--web.enable-admin-api'
            - '--web.enable-remote-write-receiver'
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rube-goldberg
  labels:
    app: prometheus
    milestone: "11"
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rube-goldberg
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: 'otel-collector-self'
        static_configs:
          - targets: ['otel-collector:8888']
      - job_name: 'otel-collector-metrics'
        static_configs:
          - targets: ['otel-collector:8889']
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['rube-goldberg']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: rube-goldberg
data:
  rg-alerts.yml: |
    groups:
      - name: rube-goldberg-local
        rules:
          - alert: RunDurationTooLong
            expr: rg_run_end_to_end_seconds > 120
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Run exceeding two minutes"
              description: "End-to-end run duration is above 120s (threshold per arch §20.5)."

          - alert: KafkaConsumerLagHigh
            expr: rg_kafka_consumer_lag > 50
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Kafka consumer lag above local threshold"
              description: "rg_kafka_consumer_lag is above 50 (small local threshold per arch §20.5)."

          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total{namespace="rube-goldberg"}[1h]) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod restarted more than twice"
              description: "A pod in rube-goldberg restarted more than twice in the last hour."

          - alert: OcrQualityAttemptThree
            expr: sum(rg_ocr_quality_rejections_total) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "OCR quality rejection recorded"
              description: "rg_ocr_quality_rejections_total is increasing (OCR quality attempt reached)."

          - alert: OtelExportFailures
            expr: |
              sum(rate(otelcol_exporter_send_failed_spans_total[5m])) > 0
              or sum(rate(otelcol_exporter_enqueue_failed_spans_total[5m])) > 0
              or sum(rate(otelcol_exporter_send_failed_log_records_total[5m])) > 0
              or sum(rate(otelcol_exporter_send_failed_metric_points_total[5m])) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "OpenTelemetry export failures"
              description: "Collector is reporting dropped/failed OTLP exports."

          - alert: ArtifactStorageHigh
            expr: sum(rg_artifact_bytes) > 1073741824
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Artifact storage above configured size"
              description: "Sum of rg_artifact_bytes exceeds 1GiB (configurable size per arch §20.5)."