apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-normalizer
  namespace: rube-goldberg
  labels:
    app: vector-normalizer
    milestone: '5'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-normalizer
  template:
    metadata:
      labels:
        app: vector-normalizer
    spec:
      containers:
      - name: vector-normalizer
        image: rghello-registry:5001/vector-normalizer:milestone5
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BOOTSTRAP
          value: kafka.rube-goldberg.svc.cluster.local:9092
        - name: KAFKA_GROUP_ID
          value: vector-normalizer
        - name: NORMALIZER_INPUT_TOPIC
          value: rg.geometry-expanded.v1
        - name: NORMALIZER_OUTPUT_TOPIC
          value: rg.glyph-normalized.v1
        - name: MINIO_ENDPOINT
          value: minio.rube-goldberg.svc.cluster.local:9000
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-user
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-password
        - name: MINIO_BUCKET
          value: rube-goldberg-artifacts
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 192Mi
            cpu: 250m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-run
          mountPath: /var/run
      serviceAccountName: vector-normalizer
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-run
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-normalizer
  namespace: rube-goldberg
  labels:
    app: vector-normalizer
    milestone: '5'
