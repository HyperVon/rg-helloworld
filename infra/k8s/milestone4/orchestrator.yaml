apiVersion: apps/v1
kind: Deployment
metadata:
  name: run-orchestrator
  namespace: rube-goldberg
  labels:
    app: run-orchestrator
    milestone: '4'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: run-orchestrator
  template:
    metadata:
      labels:
        app: run-orchestrator
    spec:
      containers:
      - name: orchestrator
        image: rghello-registry:5001/run-orchestrator:milestone4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_BOOTSTRAP
          value: kafka.rube-goldberg.svc.cluster.local:9092
        - name: REDIS_URL
          value: redis://redis-master.rube-goldberg.svc.cluster.local:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: redis-password
        - name: ORCHESTRATOR_PORT
          value: '8080'
        - name: GLYPH_CATALOG_URL
          value: http://glyph-catalog.rube-goldberg.svc.cluster.local:8080/ws/glyph-catalog
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 15
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 384Mi
            cpu: 500m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-run
          mountPath: /var/run
      serviceAccountName: run-orchestrator
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: run-orchestrator
  namespace: rube-goldberg
spec:
  selector:
    app: run-orchestrator
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: run-orchestrator
  namespace: rube-goldberg
  labels:
    app: run-orchestrator
    milestone: '4'
