apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-pipeline
  namespace: rube-goldberg
  labels:
    app: image-pipeline
    milestone: '7'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-pipeline
  template:
    metadata:
      labels:
        app: image-pipeline
    spec:
      containers:
      - name: image-pipeline
        image: rghello-registry:5001/image-pipeline:milestone7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PIPELINE_BUCKET
          value: rube-goldberg-artifacts
        - name: MINIO_ENDPOINT
          value: http://minio.rube-goldberg.svc.cluster.local:9000
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-user
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-password
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.rube-goldberg.svc.cluster.local:9092
        - name: KAFKA_CONSUMER_GROUP
          value: image-pipeline-v1
        - name: TRACEPARENT_HEADER
          value: 00-00000000000000000000000000000000-0000000000000000-00
        command:
        - python3
        - -m
        - rg_image_pipeline.cli
        - serve
        args: []
        readinessProbe:
          exec:
            command:
            - python3
            - -c
            - import rg_image_pipeline
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - import rg_image_pipeline
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
            cpu: 500m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-run
          mountPath: /var/run
      serviceAccountName: image-pipeline
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: image-pipeline
  namespace: rube-goldberg
  labels:
    app: image-pipeline
    milestone: '7'
spec:
  selector:
    app: image-pipeline
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-pipeline
  namespace: rube-goldberg
  labels:
    app: image-pipeline
    milestone: '7'
