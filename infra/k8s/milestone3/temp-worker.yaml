apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-worker
  namespace: rube-goldberg
  labels:
    app: temp-worker
    milestone: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temp-worker
  template:
    metadata:
      labels:
        app: temp-worker
    spec:
      containers:
        - name: temp-worker
          image: rghello-registry:5001/temp-worker:milestone3
          imagePullPolicy: Always
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.rube-goldberg.svc.cluster.local:9092
            - name: PLANNING_TOPIC
              value: rg.glyph-blueprints.v1
            - name: TEMP_ECHO_TOPIC
              value: rg.temp-echo.v1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
