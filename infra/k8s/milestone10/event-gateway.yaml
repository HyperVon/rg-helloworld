apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-gateway
  namespace: rube-goldberg
  labels:
    app: event-gateway
    milestone: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-gateway
  template:
    metadata:
      labels:
        app: event-gateway
    spec:
      containers:
        - name: event-gateway
          image: rghello-registry:5001/event-gateway:milestone11
          imagePullPolicy: Always
          env:
            - name: REDIS_URL
              value: "redis://redis-master.rube-goldberg.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
            - name: TRACEPARENT_HEADER
              value: "00-00000000000000000000000000000000-0000000000000000-00"
          ports:
            - containerPort: 3001
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: event-gateway
  namespace: rube-goldberg
  labels:
    app: event-gateway
    milestone: "10"
spec:
  selector:
    app: event-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3001
