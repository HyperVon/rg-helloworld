apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-inspector
  namespace: rube-goldberg
  labels:
    app: artifact-inspector
    milestone: '10'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artifact-inspector
  template:
    metadata:
      labels:
        app: artifact-inspector
    spec:
      containers:
      - name: artifact-inspector
        image: rghello-registry:5001/artifact-inspector:milestone11
        imagePullPolicy: IfNotPresent
        env:
        - name: ORCHESTRATOR_URL
          value: http://run-orchestrator.rube-goldberg.svc.cluster.local:8080
        ports:
        - containerPort: 4568
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 4568
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 4568
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 192Mi
            cpu: 250m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-run
          mountPath: /var/run
      serviceAccountName: artifact-inspector
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-inspector
  namespace: rube-goldberg
  labels:
    app: artifact-inspector
    milestone: '10'
spec:
  selector:
    app: artifact-inspector
  ports:
  - name: http
    port: 80
    targetPort: 4568
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifact-inspector
  namespace: rube-goldberg
  labels:
    app: artifact-inspector
    milestone: '10'
