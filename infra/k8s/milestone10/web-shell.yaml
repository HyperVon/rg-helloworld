apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-shell
  namespace: rube-goldberg
  labels:
    app: web-shell
    milestone: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-shell
  template:
    metadata:
      labels:
        app: web-shell
    spec:
      containers:
        - name: web-shell
          image: rghw-registry:5001/web-shell:milestone10
          imagePullPolicy: Always
          env:
            - name: VITE_API_URL
              value: "http://event-gateway.rube-goldberg.svc.cluster.local"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-shell
  namespace: rube-goldberg
  labels:
    app: web-shell
    milestone: "10"
spec:
  selector:
    app: web-shell
  ports:
    - name: http
      port: 80
      targetPort: 3000
