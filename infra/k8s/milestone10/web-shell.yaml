apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-shell
  namespace: rube-goldberg
  labels:
    app: web-shell
    milestone: '10'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-shell
  template:
    metadata:
      labels:
        app: web-shell
    spec:
      containers:
      - name: web-shell
        image: rghello-registry:5001/web-shell:milestone11
        imagePullPolicy: IfNotPresent
        env:
        - name: VITE_API_URL
          value: http://event-gateway.rube-goldberg.svc.cluster.local
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 192Mi
            cpu: 250m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-run
          mountPath: /var/run
      serviceAccountName: web-shell
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-shell
  namespace: rube-goldberg
  labels:
    app: web-shell
    milestone: '10'
spec:
  selector:
    app: web-shell
  ports:
  - name: http
    port: 80
    targetPort: 3000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-shell
  namespace: rube-goldberg
  labels:
    app: web-shell
    milestone: '10'
