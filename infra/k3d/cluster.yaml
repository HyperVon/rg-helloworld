apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: rube-goldberg
servers: 1
agents: 0
registries:
  create:
    name: rghello-registry
    host: "0.0.0.0"
    hostPort: "5001"
options:
  k3d:
    wait: true
    timeout: "60s"
    disableLoadbalancer: false
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
